[package]
name = "storage-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
once_cell = "1.19"
anyhow = "1.0"
dashmap = "6.1"
futures-util = "0.3"
alloy = { version = "1", features = ["full"] }
alloy-sol-types = "1"
url = "2.5.0"
bytes = "1.5"
chrono = "0.4"
network = { path = "../network" }
[build-dependencies]
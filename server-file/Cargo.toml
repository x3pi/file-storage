[package]
name = "storage-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
once_cell = "1.19"
anyhow = "1.0"
dashmap = "6.1"
futures-util = "0.3"
alloy = { version = "1", features = ["full"] }
alloy-sol-types = "1"
url = "2.5.0"
bytes = "1.5"
chrono = "0.4"
network = { path = "../network" }
log = "0.4"
rlimit = "0.10"
flexi_logger = { version = "0.28", features = ["compress", "async"] }
num_cpus = "1.16.0"
sysinfo = "0.31"
# WebTransport (HTTP/3 over QUIC) — thay thế HTTPS Axum cho Web Client
wtransport = "0.7"
sha2 = "0.10"

[build-dependencies]
